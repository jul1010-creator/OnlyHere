<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale, no user-scalable=no. Both were here to stop iOS
         zooming the page when a field is focused, and the real cause of that is
         a field rendered under 16px, which is fixed where the field is styled.
         Meanwhile Android honours maximum-scale exactly as specified, so this
         line was genuinely stopping Android users from pinching to zoom at all.
         MDN treats any maximum-scale under 3 as an accessibility failure. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ── THIS HAS TO BE THE DEFAULT THEME'S COLOUR, WHICHEVER IT IS ──
         applyTheme corrects this tag at runtime, so the only thing it decides is
         the FIRST frame: the phone's browser chrome paints this, then changes.
         Small, and it is the very first pixel of the product anybody sees.

         It has now been wrong in both directions. It read #0A0F1E while the warm
         theme was the default, was corrected to #12100B, and then DEFAULT_THEME
         became "dark" on 22 August and left this holding the warm colour again.
         A constant in a second file cannot follow a decision made in the first,
         so the suite reads THEMES[DEFAULT_THEME].bg and compares. Change the
         default theme and this line goes red until it is changed with it.

         The body background below is the same colour for the same reason. -->
    <meta name="theme-color" content="#0A0F1E" />

    <!-- ── THE RESERVATION THAT ONLY EXISTS IF IT IS WRITTEN DOWN ──
         Oliver, 17 Aug 2026: "I also want you to write on the pages that I claim
         copyright on my texts and guides."

         The copyright itself needs no notice: the writing is his the moment it
         is written, in Denmark and everywhere else in the Berne system. This tag
         is the other half, and that one genuinely does not exist unless it is
         stated. EU law lets anybody mine a lawfully accessible site for text and
         data UNLESS the rightsholder reserves the right in a machine-readable
         way, so silence here is permission. The same reservation is in
         robots.txt, in prose on /terms.html, and in src/utils/rights.js.

         "noai, noimageai" is what the crawlers that honour anything actually
         read. It is a request, not a fence, and it is worth having for the ones
         that do honour it and as evidence of an express reservation for the ones
         that do not.

         AND "index, follow" IS STATED EXPLICITLY, which is not decoration. The
         first version of this tag carried the two AI tokens ALONE, in the
         standard `robots` slot — the same slot that controls whether Gemlyx
         appears in search at all. Absence of noindex does mean indexable, so
         that version was almost certainly harmless; "almost certainly" is not a
         good enough answer on the tag that decides whether a search engine keeps
         117 pages, on a site with no organic traffic yet. Spelling out the
         positive directives costs nothing and leaves no room for a strict parser
         to read a list with no recognised directive in it and do something
         creative. Found by auditing the live site tonight. -->
    <meta name="robots" content="index, follow, noai, noimageai" />
    <meta name="tdm-reservation" content="1" />

    <title>Gemlyx. It exists nowhere else.</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- ── THE TYPEFACE WAS LOADING FOUR LEVELS DEEP ────────────────────
         17 Aug 2026. Fraunces is referenced 89 times in this app and was being
         requested by an @import inside a <style> tag that REACT RENDERS. So the
         chain was: HTML, then 1.4 MB of JavaScript, then parse, then mount, then
         a style tag appears, then a request to fonts.googleapis.com, then a
         second request to fonts.gstatic.com for the actual font file. The browser
         cannot see any of it in the HTML, so it cannot start early, and every
         heading in the app rendered in a fallback serif until the whole chain
         finished. On a phone on mobile data that is the first impression.
         @import is also the slowest form of this even in a real stylesheet.

         In the head now, where the preload scanner finds it before a line of
         JavaScript has run. The gstatic preconnect matters as much as the
         googleapis one and was missing: googleapis serves the CSS, gstatic
         serves the font binaries, and they are different hosts to resolve.
         crossorigin is required on the gstatic one or the connection is not
         reused for the font fetch. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400..700&display=swap" />

    <!-- ── WHAT A GEMLYX LINK LOOKS LIKE WHEN SOMEBODY PASTES IT ──────────
         Until 8 Aug 2026 there was nothing here at all, so every Gemlyx URL
         ever shared — a guide, a town, the front page — arrived in WhatsApp,
         iMessage, Slack or Discord as a bare grey link with no title, no
         picture and no description. None of those apps run JavaScript; they
         read these tags and nothing else. This is the baseline card for every
         page of the site. A saved guide gets its own, built from the guide,
         by api/guide-preview.js.

         og:image MUST be an absolute URL — the crawler fetches it in a
         separate request with no page context, so a relative path silently
         produces a card with no picture. The domain is written once in
         src/config.js as SITE_ORIGIN and tests/run.mjs checks that this line
         still agrees with it, so changing the domain fails a test instead of
         quietly killing every preview. -->
    <meta name="description" content="Denmark past the three days everybody spends in Copenhagen. Towns, workshops and nights out, each one checked against the place's own sources before it is printed." />
    <link rel="canonical" href="https://www.gemlyxtravel.com/" />
    <meta property="og:site_name" content="Gemlyx" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.gemlyxtravel.com/" />
    <meta property="og:title" content="Gemlyx. It exists nowhere else." />
    <meta property="og:description" content="Denmark past the three days everybody spends in Copenhagen. Towns, workshops and nights out, each one checked against the place's own sources before it is printed." />
    <meta property="og:image" content="https://www.gemlyxtravel.com/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Gemlyx" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gemlyx. It exists nowhere else." />
    <meta name="twitter:description" content="Denmark past the three days everybody spends in Copenhagen. Towns, workshops and nights out, each one checked against the place's own sources before it is printed." />
    <meta name="twitter:image" content="https://www.gemlyxtravel.com/og-default.jpg" />

    <!-- ── PROVING THIS SITE IS HIS, TO TICKETMASTER'S AFFILIATE NETWORK ──
         Oliver, 13 Aug 2026, halfway through Ticketmaster's application on
         Impact: "Is this possible? ... It's because the mail won't fking work."

         It was never going to. Impact's first verification method matches the
         SIGNUP EMAIL'S DOMAIN against the website's domain, and the account is a
         gmail address while the site is gemlyxtravel.com. Those cannot match, so
         that route is closed however many times it is retried. This is the
         second method and the one that fits: a tag in the head of the homepage,
         which Impact's verifier fetches directly.

         BOTH ATTRIBUTES ON PURPOSE. Impact's own generated snippet uses
         `value=`, which is not valid on a meta element, while anything reading
         the page as ordinary HTML looks at `content=`. Carrying both costs
         nothing and works whichever one their verifier reads.

         Nothing intercepts this page: middleware.js matches only /guide/*,
         /denmark/* and /sitemap.xml, so a request for the root is served this
         file straight from Vercel.

         PINNED BY A TEST, because index.html is exactly where a silent
         regression lives here. The canonical tag on this page pointed at
         only-here-three.vercel.app for weeks after the domain moved and nothing
         said so. A verification tag deleted in a later edit would un-verify the
         partnership the same way, and the first sign would be a commission that
         stopped arriving. -->
    <meta name="impact-site-verification" value="87383212-a6cf-40cb-ab5a-d974b44e3187" content="87383212-a6cf-40cb-ab5a-d974b44e3187" />
    <!-- And the segment exactly as Impact printed it. Their fourth method is
         "edit content", where a verifier searches the page for the raw string
         rather than parsing a tag, and a comment is fetched with the HTML while
         showing a reader nothing. Costs a line and closes the third of the three
         ways this can be checked.
         Impact-Site-Verification: 87383212-a6cf-40cb-ab5a-d974b44e3187 -->

    <!-- ── TRAVELPAYOUTS VERIFICATION, AND IT COMES BACK OUT ──────────
         TEMPORARY. Added 15 Aug 2026 to pass Travelpayouts' site check, and it
         is meant to be deleted the moment the dashboard says verified. If you
         are reading this and the site is already verified, delete this block.

         WHY IT IS HERE AT ALL, since a script in this file is the one thing
         everything else here avoids. Impact, above, verifies with a meta tag
         and a comment: inert text, no code. Travelpayouts has no equivalent.
         Their help centre lists WordPress, manual HTML, Wix and Squarespace,
         and every one of them is the same thing, a script in the head. There is
         no meta tag, no DNS record and no file upload to use instead.

         WHAT IT LOADS. emrldtp.com is Travelpayouts' Emerald infrastructure and
         NTYyNzA5 is base64 for 562709, the same partner id as the query string.
         Emerald's actual product is inserting affiliate links into your pages,
         adding hover tooltips and placing recommendation blocks that IT picks.
         Gemlyx must never run that: which places are recommended, and in what
         order, is editorial, and public/privacy.html now promises a reader in
         so many words that nothing is ranked higher because it pays.

         SO BEFORE THIS SHIPS, turn every Emerald tool OFF in the Travelpayouts
         dashboard. This tag is a doorbell, not a monetiser.

         AND THE PRIVACY PAGE IS THE CLOCK. It says Gemlyx sets no cookies of
         its own and runs no tracking pixels. That stays true only while this is
         a short verification window, which is the whole reason it is temporary
         rather than a decision. Deploy, verify, delete, deploy again.

         The wrapper attributes Travelpayouts printed are gone on purpose:
         nowprocket, data-noptimize, data-cfasync, data-wpfc-render,
         seraph-accel-crit and data-no-defer are opt-outs for WordPress cache
         plugins. There is no WordPress here and they were noise. -->
    <script>
      (function () {
        var s = document.createElement("script");
        s.async = 1;
        s.setAttribute("data-cmp-ab", "2");
        s.src = "https://emrldtp.com/NTYyNzA5.js?t=562709";
        document.head.appendChild(s);
      })();
    </script>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0A0F1E; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
