name: Build Check

# Runs a real build on every push and pull request — catches broken code
# before Vercel deploys it, and before anyone has to notice manually.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Security review, 3 Oct 2026, finding 17: read access only, and each action
# pinned to the commit of its release, so a moved tag cannot change what runs.
permissions:
  contents: read

jobs:
  build:
    name: Build the app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onlyhere-project

    steps:
      - name: Check out the repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: onlyhere-project/package-lock.json

      - name: Install dependencies
        run: npm ci
      - name: Run the test suite
        run: node tests/run.mjs
      - name: Build (this is the real check)
        run: npm run build

      - name: Report success
        if: success()
        run: echo "✅ Build passed — safe to deploy."
